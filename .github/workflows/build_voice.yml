name: Create Voice Package
on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'Kies stem (Fenna of Maarten)'
        required: true
        default: 'Fenna'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: PHP en Python installeren
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl

      - name: Systeertools installeren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg vorbis-tools
          
      - name: Stemmen genereren via Azure
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: |
          cd "TTS voice creator"
          
          # 1. Schakel over naar de Nederlandse CSV
          sed -i 's/all_dreame_hu.csv/all_dreame_nl.csv/g' ttscreate.py
          
          # 2. FIX VOOR SPATIES: Dwing het Python-script om aanhalingstekens rond de tekst te zetten bij het aanroepen van PHP
          sed -i 's/bing_hu_voice.php %s/bing_hu_voice.php "%s"/g' ttscreate.py
          
          # 3. Herschrijf bing_hu_voice.php met de exacte, herstelde array-indexen [1], [2], [3]
          cat << 'EOF' > bing_hu_voice.php
          <?php
          if ($argc < 4) exit(1);
          
          // Indexen 100% correct hersteld naar de originele structuur
          $szoveg = $argv[1];
          $mentes = $argv[2];
          $hang = $argv[3];
          
          $dir = $hang; 
          $filePath = $dir . "/" . $mentes . ".wav";
          
          if (file_exists($filePath)) {
              exit(0);
          }
          
          if (!is_dir($dir)) mkdir($dir, 0777, true);
          $apiKey = getenv('AZURE_SPEECH_KEY');
          
          $voiceName = ($hang == "Maarten") ? "nl-NL-MaartenNeural" : "nl-NL-FennaNeural";
          
          $cleanText = htmlspecialchars($szoveg, ENT_XML1, 'UTF-8');
          $ssml = "<speak version='1.0' xml:lang='nl-NL'><voice xml:lang='nl-NL' name='" . $voiceName . "'><lang xml:lang='nl-NL'>" . $cleanText . "</lang></voice></speak>";
          
          $ch = curl_init("https://microsoft.com");
          curl_setopt($ch, CURLOPT_POST, 1);
          curl_setopt($ch, CURLOPT_POSTFIELDS, $ssml);
          curl_setopt($ch, CURLOPT_FOLLOWLOCATION, true);
          curl_setopt($ch, CURLOPT_HTTPHEADER, array(
              "Content-type: application/ssml+xml; charset=utf-8",
              "X-Microsoft-OutputFormat: riff-16khz-16bit-mono-pcm",
              "Ocp-Apim-Subscription-Key: " . $apiKey,
              "Ocp-Apim-Subscription-Region: northeurope",
              "User-Agent: TTSPHP"
          ));
          curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
          $result = curl_exec($ch);
          $http_code = curl_getinfo($ch, CURLINFO_HTTP_CODE);
          curl_close($ch);
          
          if ($http_code === 200 && $result) {
              file_put_contents($filePath, $result);
              usleep(250000); 
          } else {
              echo "Fout bij downloaden code " . $http_code . " voor tekst: " . $szoveg . "\n";
          }
          ?>
          EOF
          
          # Start het genereren van de stemmen
          echo "igen" | python ttscreate.py ${{ github.event.inputs.voice }} --convert || true

      - name: Handmatige OGG-conversie en opschoning voor Dreame
        run: |
          cd "TTS voice creator"
          TARGET_DIR="${{ github.event.inputs.voice }}"
          
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR=$(echo "$TARGET_DIR" | tr '[:upper:]' '[:lower:]')
          fi
          
          echo "Verwerken van map: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # Converteer WAV's naar ogg zonder extensie voor Dreame
          for wavfile in *.wav; do
            if [ -f "$wavfile" ]; then
              filename="${wavfile%.wav}"
              ffmpeg -i "$wavfile" -c:a libvorbis -b:a 64k "${filename}.ogg" -y q>/dev/null
              mv "${filename}.ogg" "$filename"
              rm "$wavfile"
            fi
          done
          
          cd ..
          tar -czf ../dreame_voicepack_nl.tar.gz "$TARGET_DIR"

      - name: Genereer installatiegegevens (Grootte en MD5)
        run: |
          echo "=== INSTALLATIE INFO VOOR HOMEASSISTANT / VALETUDO ==="
          echo "Bestandsgrootte (bytes): $(stat -c%s dreame_voicepack_nl.tar.gz)"
          echo "MD5 Hash: $(md5sum dreame_voicepack_nl.tar.gz | awk '{print $1}')"
          echo "======================================================="

      - name: Bestand bewaren als download
        uses: actions/upload-artifact@v4
        with:
          name: dreame_voicepack_nl
          path: ./dreame_voicepack_nl.tar.gz
