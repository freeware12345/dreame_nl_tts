name: Create Voice Package
on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'Kies stem (Fenna of Maarten)'
        required: true
        default: 'Fenna'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: PHP en Python installeren
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Systeertools installeren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg vorbis-tools

      - name: Stemmen genereren via Azure
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: |
          cd "TTS voice creator"
          
          # Fix de API-sleutel in het PHP-bestand
          sed -i 's/"API_KULCS"/"'"$AZURE_SPEECH_KEY"'"/g' bing_hu_voice.php
          
          # Forceer het Python-script om naar jouw Nederlandse CSV te kijken in plaats van de Hongaarse
          sed -i 's/all_dreame_hu.csv/all_dreame_nl.csv/g' ttscreate.py
          
          # Maak alvast de juiste map aan voor de stem in kleine letters (voorkomt PHP mappen-fout)
          STEM_KLEIN=$(echo "${{ github.event.inputs.voice }}" | tr '[:upper:]' '[:lower:]')
          mkdir -p "$STEM_KLEIN"
          
          # Start het genereren van de stemmen
          echo "igen" | python ttscreate.py ${{ github.event.inputs.voice }} --convert

      - name: Handmatig inpakken voor Dreame
        run: |
          cd "TTS voice creator"
          STEM_KLEIN=$(echo "${{ github.event.inputs.voice }}" | tr '[:upper:]' '[:lower:]')
          
          # Controleer waar de bestanden staan en pak ze in
          if [ -d "$STEM_KLEIN" ] && [ "$(ls -A $STEM_KLEIN)" ]; then
            cd "$STEM_KLEIN"
            tar -czf ../../dreame_voicepack_nl.tar.gz ./*
          else
            cd ..
            tar -czf dreame_voicepack_nl.tar.gz ./**/*.ogg ./**/*.wav 2>/dev/null || tar -czf dreame_voicepack_nl.tar.gz ./*
          fi

      - name: Bestand bewaren als download
        uses: actions/upload-artifact@v4
        with:
          name: dreame_voicepack_nl
          path: ./dreame_voicepack_nl.tar.gz
