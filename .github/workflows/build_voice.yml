name: Test Azure Key Only
on:
  workflow_dispatch:

jobs:
  test_key:
    runs-on: ubuntu-latest
    steps:
      - name: PHP installeren voor test
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl

      - name: Voer Azure Sleutel-test uit
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: |
          cat << 'EOF' > test_azure.php
          <?php
          $apiKey = getenv('AZURE_SPEECH_KEY');
          echo "Sleutellengte controleren: " . strlen($apiKey) . " tekens.\n";
          
          if (strlen($apiKey) !== 32) {
              echo "FOUT: Een Azure-sleutel moet exact 32 tekens lang zijn!\n";
          }

          echo "Verbinding maken met Microsoft Azure (North Europe)...\n";
          
          $ch = curl_init("https://microsoft.com");
          curl_setopt($ch, CURLOPT_POST, 1);
          curl_setopt($ch, CURLOPT_HTTPHEADER, array(
              "Ocp-Apim-Subscription-Key: " . $apiKey, 
              "Content-Length: 0"
          ));
          curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
          curl_setopt($ch, CURLOPT_HEADER, true); // Vraag om de volledige serverreactie
          
          $response = curl_exec($ch);
          $http_code = curl_getinfo($ch, CURLINFO_HTTP_CODE);
          curl_close($ch);

          echo "HTTP Statuscode van Microsoft: " . $http_code . "\n";
          echo "Volledige reactie van de server:\n";
          echo "----------------------------------------\n";
          echo $response . "\n";
          echo "----------------------------------------\n";

          if ($http_code === 200) {
              echo "SUCCES: Je sleutel en regio zijn 100% correct!\n";
          } else {
              echo "FOUT: Microsoft weigert de verbinding.\n";
          }
          ?>
          EOF
          php test_azure.php
